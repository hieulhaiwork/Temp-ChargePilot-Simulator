# Alembic - schema migrations for ChargePilot (ADR-005; docs/plan/40-database.md section 7).
# Keep this file ASCII-only: configparser reads it with the OS locale encoding
# (cp1258 on Vietnamese Windows) and fails on non-ASCII bytes.
#
#   alembic upgrade head                                        # apply migrations (DB from DATABASE_URL / settings)
#   alembic revision --autogenerate -m "what" --rev-id 0002     # after editing src/db/tables.py - REVIEW the file
#   alembic -x url=sqlite:///./data/try.db upgrade head         # use another DB for one run
#
# Do NOT set sqlalchemy.url here: the connection string is a secret and lives in env vars only.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
