# Render Blueprint — BẢN TEST (gói free), theo nhánh develop.
# Khi tạo Blueprint trên Render, đặt Blueprint Path = render.test.yaml.
# Các biến `sync: false` là secret: Render hỏi giá trị lúc tạo, KHÔNG ghi giá trị vào file này.
# Lưu ý gói free: 750 giờ/tháng cho cả workspace — KHÔNG ping giữ thức bản test (docs/plan/50-devops.md §8).
services:
  - type: web
    name: p019-backend-test
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: develop
    # Chỉ deploy khi CI (lint, test, docker-smoke) trên commit đó đã xanh.
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_API_KEY
        sync: false
      # Domain cố định của web bản test (nếu có), phân cách bằng dấu phẩy.
      - key: CORS_ORIGINS
        sync: false
      # Regex cho URL preview của Vercel (đổi theo từng PR). CHỈ đặt ở bản test.
      - key: CORS_ORIGIN_REGEX
        sync: false
      # Dùng database / nhánh Neon RIÊNG cho bản test — không dùng chung với production.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SEED_USERS_JSON
        sync: false
      # Vòng nền bật; gói Free ngủ sau 15 phút không request thì vòng nền cũng dừng theo.
      - key: CONTROL_LOOP_ENABLED
        value: "true"
      # ADR-018 — trạm và thuật toán của simulator R&D
      - key: STATION_ENGINE
        value: hybrid
      - key: LIVE_STRATEGY
        value: M3a
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: p019-test
      - key: LANGCHAIN_API_KEY
        sync: false
