# Chạy backend trên máy local bằng đúng image sẽ deploy.
#
#   docker compose up --build                 # backend + SQLite (./data)
#   docker compose --profile postgres up      # thêm Postgres để thử gần giống Neon;
#                                             # khi đó đặt trong .env: DATABASE_URL=postgresql://chargepilot:<mật khẩu>@db:5432/chargepilot
#
# Mật khẩu Postgres local lấy từ biến POSTGRES_PASSWORD trong .env — không ghi giá trị vào file này.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    profiles: ["postgres"]
    image: postgres:16
    environment:
      POSTGRES_USER: chargepilot
      POSTGRES_DB: chargepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env để dùng profile postgres}
    ports:
      - "5433:5432" # 5433 ở máy host để không đụng Postgres đang cài sẵn trên máy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargepilot -d chargepilot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
