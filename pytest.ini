[pytest]
# asyncio_mode=auto: async fixture (client) + async test không cần mark từng cái
asyncio_mode = auto
testpaths = tests
# Gốc repo vào sys.path để `import src...` chạy được cả với lệnh `pytest` trần (CI job simulator: src/simulator/tests
# không phải package nên pytest chỉ chèn thư mục test, không chèn gốc repo).
pythonpath = .
