# legacy_ac_only (ADR-012): kịch bản của bãi chỉ AC 8 × 7 kW (A01–A08), giới hạn 35 kW — PRD v0.2.
# config/station.yaml đã là topology hybrid `mvp1` (ADR-010) nên mã cổng / giới hạn ở đây KHÔNG khớp trạm hiện tại.
# Giữ tới khi nhóm quyết bỏ; KHÔNG dùng cho nghiệm thu / benchmark.
#
# Kịch bản AC5 — nguồn giảm đột ngột.
# Kỳ vọng (AC5): hệ thống giảm công suất NGAY để không vượt giới hạn mới (bảo vệ khẩn
# cấp, độc lập với AI), thông báo cư dân SAU và ghi log.
# Mức 20 kW là tham số ví dụ (PRD chỉ ghi "xuống mức thấp hơn").
# at_minute tính từ start_time: 12:00 + 420 = 19:00; + 540 = 21:00.

scenario_id: power_drop
name: "Nguồn giảm 35 → 20 kW lúc 19:00 (AC5)"
description: "Như cao điểm tối, nhưng giới hạn nguồn rớt còn 20 kW từ 19:00 đến 21:00."
start_time: "12:00"
duration_hours: 24
n_vehicles: 30
power_limit_kw: 35.0
session_source: synthetic
seed: 42
incidents:
  - { at_minute: 420, type: power_limit_change, new_power_limit_kw: 20.0 }
  - { at_minute: 540, type: power_limit_change, new_power_limit_kw: 35.0 }
